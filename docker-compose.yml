version: '3.8'

services:
  manual-search:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAX_HISTORY_LENGTH=${MAX_HISTORY_LENGTH:-10}
      - DB_PATH=${DB_PATH:-vectorstore}
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data
    restart: unless-stopped 